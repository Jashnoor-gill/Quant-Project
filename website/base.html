<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quant Project{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07111f;
            --bg-soft: #0b1729;
            --surface: rgba(13, 24, 40, 0.86);
            --surface-strong: #102033;
            --line: rgba(185, 211, 255, 0.14);
            --text: #e7eefc;
            --muted: #9fb0c7;
            --brand: #55d6be;
            --brand-2: #f4b860;
            --accent: #7aa7ff;
            --good: #62d18f;
            --shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Manrope', 'Segoe UI', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(85, 214, 190, 0.14), transparent 28%),
                radial-gradient(circle at top right, rgba(122, 167, 255, 0.18), transparent 26%),
                linear-gradient(180deg, #08111c 0%, #07111f 55%, #050b14 100%);
            min-height: 100vh;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.15));
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        nav {
            background: rgba(9, 18, 31, 0.84);
            backdrop-filter: blur(16px);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px 22px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        
        nav a {
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            margin: 0 12px;
            transition: color 0.25s, opacity 0.25s, transform 0.25s;
            opacity: 0.9;
        }
        
        nav a:hover {
            color: var(--text);
            transform: translateY(-1px);
        }
        
        nav a.active {
            color: var(--text);
            border-bottom: 2px solid var(--brand);
            padding-bottom: 6px;
        }
        
        .logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        
        main {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow);
        }
        
        h1 {
            color: var(--text);
            margin-bottom: 10px;
            font-size: 34px;
            line-height: 1.05;
        }
        
        h2 {
            color: var(--text);
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 21px;
        }
        
        .subtitle {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.7;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(85, 214, 190, 0.12);
            color: var(--brand);
            border: 1px solid rgba(85, 214, 190, 0.18);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            border-radius: 20px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="number"],
        select {
            padding: 10px;
            border: 1px solid rgba(185, 211, 255, 0.18);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(5, 11, 20, 0.8);
            color: var(--text);
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--brand);
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--brand);
            cursor: pointer;
            transition: background 0.3s;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--brand);
            cursor: pointer;
            border: none;
        }
        
        input[type="range"]:hover::-webkit-slider-thumb {
            background: var(--brand-2);
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--brand), #3ea6ff);
            color: #03121f;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-size: 14px;
        }
        
        button:hover {
            background: linear-gradient(135deg, #6ce7cf, #57b3ff);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--brand), #3ea6ff);
            grid-column: 1 / -1;
            padding: 15px;
            font-size: 16px;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            border: 1px solid var(--line);
        }
        
        .results {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--line);
            border-radius: 20px;
            display: none;
        }
        
        .results.active {
            display: block;
        }
        
        .plot-container {
            text-align: center;
            margin: 20px 0;
        }
        
        .plot-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
        }
        
        thead {
            background: #667eea;
            color: white;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.22);
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
            background: rgba(255,255,255,0.03);
            color: var(--text);
            background: #f0f0f0;
        }
        
            background: rgba(85, 214, 190, 0.14);
            color: var(--text);
            background: #667eea;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            margin: 5px;
            border-bottom: 1px solid rgba(185, 211, 255, 0.12);
            font-size: 13px;
        }
        
            background: rgba(255,255,255,0.04);
            background: #27ae60;
        }
        
        .metric.warning {
            background: rgba(122, 167, 255, 0.14);
            color: var(--text);
        
            border-radius: 999px;
            display: none;
            text-align: center;
            padding: 20px;
            border: 1px solid rgba(122, 167, 255, 0.16);
        }
        
        .loading.active {
            background: rgba(98, 209, 143, 0.15);
            border-color: rgba(98, 209, 143, 0.18);
        }
        
        .spinner {
            background: rgba(244, 184, 96, 0.16);
            border-color: rgba(244, 184, 96, 0.18);
        }

        .hero {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            align-items: stretch;
            margin-bottom: 28px;
        }

        .hero-panel,
        .info-panel {
            border: 1px solid var(--line);
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
            padding: 24px;
        }

        .hero-copy p {
            color: var(--muted);
            line-height: 1.75;
            max-width: 62ch;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        .hero-actions a,
        .hero-actions button {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
        }

        .hero-list {
            list-style: none;
            display: grid;
            gap: 12px;
            margin-top: 18px;
        }

        .hero-list li {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            color: var(--muted);
            border: 1px solid rgba(185, 211, 255, 0.08);
        }

        .hero-list strong {
            color: var(--text);
            font-weight: 700;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .feature-card {
            padding: 18px;
            border-radius: 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(185, 211, 255, 0.12);
        }

        .feature-card h3 {
            color: var(--text);
            margin-bottom: 8px;
            font-size: 16px;
        }

        .feature-card p {
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
        }

        .timeline {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .step {
            padding: 18px;
            border-radius: 18px;
            background: rgba(5, 11, 20, 0.6);
            border: 1px solid rgba(185, 211, 255, 0.12);
        }

        .step span {
            display: inline-flex;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-family: 'IBM Plex Mono', monospace;
            color: #041019;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
            }

            nav {
                flex-direction: column;
                align-items: flex-start;
            }
            border-top: 4px solid #667eea;

            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            border: 1px solid #f5c6cb;
            display: none;
        }
        
        .error.active {
            display: block;
        }
        
        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            border: 1px solid #c3e6cb;
            display: none;
        }
        
        .success-msg.active {
            display: block;
        }
        
        .value-display {
            font-weight: 600;
            color: #667eea;
            margin-top: 5px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        
        .card h3 {
            color: var(--text);
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .card-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--text);
        }
        
        .card-label {
            font-size: 12px;
            color: var(--muted);
            margin-top: 5px;
        }
        
        .download-btn {
            background: linear-gradient(135deg, var(--good), #37c6b6);
            margin-top: 10px;
            color: #03121f;
        }
        
        .download-btn:hover {
            background: linear-gradient(135deg, #79e4a8, #57dbcb);
        }
        
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo">📊 Quant Project</div>
            <div>
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
                <a href="/simulator/finance" class="{% if 'finance' in request.path %}active{% endif %}">Finance Sim</a>
                <a href="/simulator/algorithm" class="{% if 'algorithm' in request.path %}active{% endif %}">Algorithm Tuner</a>
                <a href="/simulator/budget" class="{% if 'budget' in request.path %}active{% endif %}">Budget Sweep</a>
            </div>
        </nav>
        
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <script>
        // Common utility functions
        async function fetchJSON(url, options = {}) {
            try {
                const response = await fetch(url, {
                    headers: { 'Content-Type': 'application/json' },
                    ...options
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        }
        
        function showError(message) {
            const errorDiv = document.querySelector('.error');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.classList.add('active');
            }
        }
        
        function hideError() {
            const errorDiv = document.querySelector('.error');
            if (errorDiv) {
                errorDiv.classList.remove('active');
            }
        }
        
        function showSuccess(message) {
            const successDiv = document.querySelector('.success-msg');
            if (successDiv) {
                successDiv.textContent = message;
                successDiv.classList.add('active');
                setTimeout(() => successDiv.classList.remove('active'), 3000);
            }
        }
        
        function toggleLoading(show = true) {
            const loadingDiv = document.querySelector('.loading');
            if (loadingDiv) {
                loadingDiv.classList.toggle('active', show);
            }
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
